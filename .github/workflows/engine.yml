name: iOS build

on:
  push:
    branches: [main]
    paths: ['zephyr-engine/**', 'app/**', '.github/workflows/engine.yml']
  workflow_dispatch:
    inputs:
      backports:
        description: 'Apply the zephyr-backports security layer (on for every push build)'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: zephyr-engine

env:
  # zephyr-backports security fixes (SB-001..034, as the Android app ships through zephyr-java):
  # always on for push builds; only a manual run with the box unticked builds without them.
  ZIOS_BACKPORTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.backports) && '1' || '0' }}

jobs:
  layers:
    name: patch layers apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS layer alone
        run: scripts/setup_tree.sh
      - name: backports layer + iOS layer
        run: rm -rf work && ZIOS_BACKPORTS=1 scripts/setup_tree.sh
      - name: Strict-CSP page transform + behaviour test (jsdom)
        working-directory: app
        run: |
          rm -rf "$RUNNER_TEMP/w" && cp -r www "$RUNNER_TEMP/w"
          python3 -I scripts/csp_strict.py "$RUNNER_TEMP/w"
          npm install --prefix "$RUNNER_TEMP/jsd" --no-audit --no-fund --silent jsdom@24.1.3
          JSDOM_DIR="$RUNNER_TEMP/jsd/node_modules/jsdom" node tests/csp_strict_test.js www/index.html \
            "$RUNNER_TEMP/w/index.html" "$RUNNER_TEMP/w/aeolus-handlers.js" "$RUNNER_TEMP/w/aeolus-app.js" 2>/dev/null
      - name: Scripts embedded in the native plugins parse (notch layout, Android bridge)
        working-directory: app
        run: python3 -I tests/swift_js_check.py plugins/aeolus-native/ios/Sources

  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          cmake --version | head -1

      - name: Pinned upstream sources and patch layers
        run: scripts/setup_tree.sh

      - name: Restore dependency cache
        id: depcache
        uses: actions/cache/restore@v4
        with:
          path: |
            zephyr-engine/work/deps/${{ matrix.platform }}/prefix
            zephyr-engine/work/deps/sources
          key: deps-v2-${{ matrix.platform }}-${{ hashFiles('zephyr-engine/deps/**') }}

      - name: Dependencies (Boost 1.84, OpenSSL, libsodium, expat, unbound, zeromq)
        run: deps/build_deps.sh ${{ matrix.platform }}

      - name: Save dependency cache
        if: steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            zephyr-engine/work/deps/${{ matrix.platform }}/prefix
            zephyr-engine/work/deps/sources
          key: ${{ steps.depcache.outputs.cache-primary-key }}

      - name: Zephyr wallet libraries
        run: scripts/build_zephyr.sh ${{ matrix.platform }}

      - name: Engine library and smoke test link
        run: scripts/build_engine.sh ${{ matrix.platform }}

      - name: Smoke test in the iOS Simulator
        if: matrix.platform == 'iphonesimulator'
        run: scripts/run_smoke_simulator.sh

      - name: Upload simulator test wallets and log
        if: always() && matrix.platform == 'iphonesimulator'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-simulator
          path: ${{ runner.temp }}/zios-smoke
          retention-days: 14

      - name: Checksums
        run: shasum -a 256 work/out/${{ matrix.platform }}/libzephyr_ios.a | tee work/out/${{ matrix.platform }}/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: zephyr-ios-${{ matrix.platform }}
          path: zephyr-engine/work/out/${{ matrix.platform }}
          retention-days: 30

      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          find work -name config.log -o -name CMakeError.log -o -name CMakeConfigureLog.yaml | while read -r f; do
            mkdir -p "logs/$(dirname "$f")" && cp "$f" "logs/$f"; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ matrix.platform }}
          path: zephyr-engine/logs
          retention-days: 14

  xcframework:
    needs: build
    runs-on: macos-15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zephyr-ios-*
      - name: Create ZephyrIOS.xcframework
        run: |
          xcodebuild -create-xcframework \
            -library zephyr-ios-iphoneos/libzephyr_ios.a -headers zephyr-ios-iphoneos/include \
            -library zephyr-ios-iphonesimulator/libzephyr_ios.a -headers zephyr-ios-iphonesimulator/include \
            -output ZephyrIOS.xcframework
          ditto -c -k --keepParent ZephyrIOS.xcframework ZephyrIOS.xcframework.zip
          shasum -a 256 ZephyrIOS.xcframework.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ZephyrIOS.xcframework
          path: |
            ZephyrIOS.xcframework.zip
            SHA256SUMS
          retention-days: 90

  # ---------------------------------------------------------------- the app
  app:
    name: app (${{ matrix.sdk }})
    needs: xcframework
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write   # the simulator job pushes its screenshot to the ci-screens branch
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphoneos, iphonesimulator]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZephyrIOS.xcframework
          path: ${{ runner.temp }}/engine
      - name: Engine framework into the native plugin
        run: |
          mkdir -p plugins/aeolus-native/ios/Frameworks
          ditto -x -k "$RUNNER_TEMP/engine/ZephyrIOS.xcframework.zip" plugins/aeolus-native/ios/Frameworks/
          ls plugins/aeolus-native/ios/Frameworks/ZephyrIOS.xcframework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web assets and plugins
        run: |
          npm ci --no-audit --no-fund
          # iOS runs the page under script-src 'self': inline script and handlers become files
          # (www/index.html in the repo stays identical to the Android page)
          python3 -I scripts/csp_strict.py www
          npx cap sync ios
      - name: Payment alert logic test (swiftc, no engine)
        working-directory: app/plugins/aeolus-native
        run: |
          swiftc -o "$RUNNER_TEMP/pftest" ios/Sources/AeolusNative/PaymentFilter.swift tests/main.swift
          "$RUNNER_TEMP/pftest"
      - name: Build (unsigned)
        run: |
          if [ "${{ matrix.sdk }}" = iphoneos ]; then DEST='generic/platform=iOS'; else DEST='generic/platform=iOS Simulator'; fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk ${{ matrix.sdk }} -destination "$DEST" -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || true
          grep -E "error:|warning: .*AeolusNative|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/xcodebuild.log" | head -60 || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log" || { tail -60 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          APP="$RUNNER_TEMP/dd/Build/Products/Release-${{ matrix.sdk }}/App.app"
          ls -la "$APP" | head -40
          plutil -p "$APP/Info.plist" || true
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" 2>/dev/null || true)"
          echo "bundle id: '$BID'"
          if [ "$BID" != com.aeolus.wallet ]; then tail -80 "$RUNNER_TEMP/xcodebuild.log"; exit 1; fi
          # Strict CSP made it into the app: no inline script, no 'unsafe-inline' in script-src.
          grep -o "script-src[^;]*" "$APP/public/index.html" | tee /dev/stderr | grep -qv "unsafe-inline"
          test -f "$APP/public/aeolus-app.js" && test -f "$APP/public/aeolus-handlers.js"
          if grep -Eq "<script>|\son(click|input)=\"" "$APP/public/index.html"; then echo "inline code left in the page"; exit 1; fi
          # Background payment alerts: app refresh + processing modes and the two task ids, and no push mode.
          MODES="$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist")"
          echo "$MODES"
          echo "$MODES" | grep -q fetch && echo "$MODES" | grep -q processing && echo "$MODES" | grep -q audio || { echo "missing background modes"; exit 1; }
          if echo "$MODES" | grep -q remote-notification; then echo "unexpected remote-notification mode"; exit 1; fi
          IDS="$(/usr/libexec/PlistBuddy -c 'Print :BGTaskSchedulerPermittedIdentifiers' "$APP/Info.plist")"
          echo "$IDS"
          echo "$IDS" | grep -q com.aeolus.wallet.refresh && echo "$IDS" | grep -q com.aeolus.wallet.processing || { echo "missing task ids"; exit 1; }
      - name: Unsigned .ipa for sideloading
        if: matrix.sdk == 'iphoneos'
        run: |
          cd "$RUNNER_TEMP"
          rm -rf Payload && mkdir Payload
          cp -R dd/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Aeolus-unsigned.ipa Payload
          shasum -a 256 Aeolus-unsigned.ipa | tee SHA256SUMS
          ls -l Aeolus-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: matrix.sdk == 'iphoneos'
        with:
          name: Aeolus-unsigned-ipa
          path: |
            ${{ runner.temp }}/Aeolus-unsigned.ipa
            ${{ runner.temp }}/SHA256SUMS
          retention-days: 30
      - name: Launch in the Simulator
        if: matrix.sdk == 'iphonesimulator'
        run: |
          UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in sorted(d.items(), reverse=True):
              if "iOS" in rt:
                  for x in devs:
                      if x["name"].startswith("iPhone"):
                          print(x["udid"]); sys.exit(0)
          sys.exit(1)')"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b > /dev/null
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" com.aeolus.wallet
          sleep 25
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/screens/launch.png"
          xcrun simctl spawn "$UDID" launchctl list | grep -i aeolus || { echo "app is not running"; exit 1; }
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'process == "App" AND (messageType == error OR eventMessage CONTAINS[c] "aeolus" OR eventMessage CONTAINS[c] "capacitor")' \
            | tail -60 || true
      - name: Publish the screenshot (ci-screens branch)
        if: matrix.sdk == 'iphonesimulator' && always()
        run: |
          [ -f "$RUNNER_TEMP/screens/launch.png" ] || exit 0
          cd "$RUNNER_TEMP/screens"
          git init -q && git checkout -q -b ci-screens
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          cp launch.png "launch-${GITHUB_SHA::7}.png"
          git add -A && git commit -qm "Simulator screenshot of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
